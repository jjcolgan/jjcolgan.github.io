<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>John (JJ) Colgan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Karla:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #f5f0e8;
      --ink: #1a1714;
      --muted: #7a7065;
      --accent: #b5813b;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'Karla', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* Decorative corner lines */
    body::after {
      content: '';
      position: fixed;
      top: 24px; left: 24px; right: 24px; bottom: 24px;
      border: 1px solid rgba(26,23,20,0.12);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HERO ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-family: 'Karla', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 8vw, 7rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-top: 0.6rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.5s;
    }

    .name .nickname {
      color: var(--accent);
      font-style: italic;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 1.8rem auto;
      opacity: 0;
      animation: scaleIn 0.6s ease forwards 1s;
      transform-origin: center;
    }

    .profile-photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      display: block;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.5s;
    }

    /* ── NAV ── */
    nav {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.6rem 2rem 2.4rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 2s;
    }

    nav a {
      font-family: 'Karla', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.25s;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0; right: 100%;
      height: 1px;
      background: var(--accent);
      transition: right 0.3s ease;
    }

    nav a:hover {
      color: var(--ink);
    }

    nav a:hover::after {
      right: 0;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>

  <main class="hero">
    <h1 class="name">
      John <span class="nickname">(JJ)</span> Colgan
    </h1>
    <div class="divider"></div>
    <img src="jj.small.png" alt="John (JJ) Colgan" class="profile-photo" />
  </main>

  <nav>
    <a href="about.html">About</a>
    <a href="#">Work</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>

</body>
</html>
